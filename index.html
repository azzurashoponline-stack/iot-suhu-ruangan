<!DOCTYPE html>
<html>
<head>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Fire Alarm</title>
  <style>
    body { 
      font-family: Arial, sans-serif; 
      text-align: center; 
      background: linear-gradient(180deg, #1e0903 0%, #5e1c08 40%, #b3390c 100%);
      color: white; 
      margin: 0; 
      padding-top: 30px; 
      min-height: 100vh;
      overflow: hidden; 
      position: relative;
    }
    
    #fireContainer {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 1;
      overflow: hidden;
    }

    .fire-emoji {
      position: absolute;
      bottom: -80px;
      animation: melayangNaik linear forwards;
      user-select: none;
    }

    @keyframes melayangNaik {
      0% { transform: translateY(0) scale(0.5) rotate(0deg); opacity: 1; }
      50% { opacity: 0.9; }
      100% { transform: translateY(-120vh) scale(2.0) rotate(25deg); opacity: 0; }
    }

    .content-box {
      position: relative;
      z-index: 10;
      background: rgba(0, 0, 0, 0.65);
      display: inline-block;
      padding: 25px 35px;
      border-radius: 20px;
      box-shadow: 0 0 30px rgba(0,0,0,0.8);
      border: 1px solid rgba(255, 140, 0, 0.4);
      backdrop-filter: blur(5px);
    }

    h1 { font-size: 2rem; margin-top: 0; margin-bottom: 10px; }
    .suhu { font-size: 3.5rem; font-weight: bold; color: #f1c40f; margin-bottom: 20px; text-shadow: 2px 2px 5px #000; }
    
    /* Animasi Teks WARNING Berkedip */
    .warning-text {
      font-size: 2.8rem;
      font-weight: bold;
      color: #ff2a2a;
      text-shadow: 0 0 15px #ff0000, 0 0 30px #ff0000;
      animation: blinkWarning 0.6s infinite alternate;
      margin: 15px 0 5px 0;
      display: none;
      letter-spacing: 2px;
    }

    @keyframes blinkWarning {
      0% { opacity: 0.2; transform: scale(0.95); }
      100% { opacity: 1; transform: scale(1.05); }
    }

    .level-text {
      font-size: 1.6rem;
      font-weight: bold;
      color: #ffaa00;
      margin-bottom: 25px;
      display: none;
      text-shadow: 1px 1px 3px #000;
    }

    .container { display: flex; justify-content: center; gap: 30px; margin-bottom: 30px; }
    .indicator { display: flex; flex-direction: column; align-items: center; }
    
    .circle { width: 60px; height: 60px; border-radius: 50%; background-color: #555; margin-bottom: 10px; transition: 0.2s; box-shadow: 0 0 10px #000; }
    
    .buzzer-on {
      background: repeating-linear-gradient(45deg, #ff2a2a, #ff2a2a 10px, #111 10px, #111 20px) !important;
      box-shadow: 0 0 30px #ff2a2a !important;
      border: 2px solid #fff;
    }
    .buzzer-off {
      background: repeating-linear-gradient(45deg, #5c1010, #5c1010 10px, #000 10px, #000 20px) !important;
      box-shadow: 0 0 10px #000 !important;
      border: 2px solid #333;
    }

    .btn { background-color: #e74c3c; color: white; border: 2px solid #c0392b; padding: 12px 25px; font-size: 1.1rem; border-radius: 8px; cursor: pointer; font-weight: bold; transition: 0.2s; }
    .btn:active { transform: scale(0.95); }
  </style>
</head>
<body>
  <div id="fireContainer"></div>

  <div class="content-box">
    <h1>Fire Alarm</h1>
    <div class="suhu" id="nilaiSuhu">-- &deg;C</div>

    <!-- Teks Peringatan Besar & Level Bahaya -->
    <div class="warning-text" id="txtWarning">WARNING</div>
    <div class="level-text" id="txtLevel">--</div>

    <div class="container">
      <div class="indicator">
        <div class="circle" id="indHijau"></div>
        <span>Aman</span>
      </div>
      <div class="indicator">
        <div class="circle" id="indMerah"></div>
        <span>Panas</span>
      </div>
      <div class="indicator">
        <div class="circle buzzer-off" id="indBuzzer"></div>
        <span id="textBuzzer">Buzzer</span>
      </div>
    </div>

    <button class="btn" id="btnMute" onclick="toggleMute()">MUTE BUZZER</button>
  </div>

  <!-- Firebase SDK -->
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>

  <script>
    const firebaseConfig = {
      apiKey: "AIzaSyDT9qR7sXFsKVuT-u3kXd1jDOhLCuDsVLk",
      authDomain: "iot-fire-sensor.firebaseapp.com",
      databaseURL: "https://iot-fire-sensor-default-rtdb.firebaseio.com/",
      projectId: "iot-fire-sensor",
      storageBucket: "iot-fire-sensor.firebasestorage.app",
      messagingSenderId: "952901033888",
      appId: "1:952901033888:web:8f7873e3a54b8e43dd4ec5"
    };

    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();

    let fireInterval = null;
    let currentBahaya = 0;

    function buatEmojiApi(jumlah = 5) {
      const container = document.getElementById('fireContainer');
      for(let i = 0; i < jumlah; i++) {
        const fire = document.createElement('div');
        fire.className = 'fire-emoji';
        fire.innerHTML = '&#128293;';
        
        const randomLeft = Math.random() * 100; 
        const randomSize = Math.random() * 50 + 20; 
        const randomDuration = Math.random() * 1.2 + 0.5; 

        fire.style.left = randomLeft + '%';
        fire.style.fontSize = randomSize + 'px';
        fire.style.animationDuration = randomDuration + 's';

        container.appendChild(fire);
        setTimeout(() => { fire.remove(); }, randomDuration * 1000);
      }
    }

    db.ref('sensor').on('value', (snapshot) => {
      const data = snapshot.val();
      if (!data) return;

      document.getElementById('nilaiSuhu').innerHTML = Number(data.suhu).toFixed(1) + ' &deg;C';
      
      document.getElementById('indHijau').style.backgroundColor = data.hijau ? '#2ecc71' : '#1e4a2f';
      document.getElementById('indMerah').style.backgroundColor = data.merah ? '#e74c3c' : '#4a1e1e';
      
      let indBuzzer = document.getElementById('indBuzzer');
      let txtWarning = document.getElementById('txtWarning');
      let txtLevel = document.getElementById('txtLevel');

      if (data.bahaya > 0) {
        indBuzzer.className = 'circle buzzer-on';
        txtWarning.style.display = 'block';
        txtLevel.style.display = 'block';
        
        if (data.bahaya === 1) {
          txtLevel.innerHTML = "Fire level 1";
          txtLevel.style.color = "#f39c12"; // Kuning/Oranye
        } else if (data.bahaya === 2) {
          txtLevel.innerHTML = "Fire level 2";
          txtLevel.style.color = "#e74c3c"; // Merah menyala
        }
      } else {
        indBuzzer.className = 'circle buzzer-off';
        txtWarning.style.display = 'none';
        txtLevel.style.display = 'none';
      }

      // Logika Animasi Api Berdasarkan Level Bahaya
      if (data.bahaya === 2) {
        if (currentBahaya !== 2) {
          if (fireInterval) clearInterval(fireInterval);
          fireInterval = setInterval(() => buatEmojiApi(5), 30); // Spam ekstrem
          currentBahaya = 2;
        }
      } else if (data.bahaya === 1) {
        if (currentBahaya !== 1) {
          if (fireInterval) clearInterval(fireInterval);
          fireInterval = setInterval(() => buatEmojiApi(3), 500); // Sesuai irama buzzer
          currentBahaya = 1;
        }
      } else {
        if (currentBahaya !== 0) {
          if (fireInterval) clearInterval(fireInterval);
          fireInterval = null;
          currentBahaya = 0;
        }
      }
      
      let btn = document.getElementById('btnMute');
      let txtBz = document.getElementById('textBuzzer');
      if (data.is_muted) {
        btn.innerHTML = "BUZZER DIMUTE";
        btn.style.backgroundColor = "#555";
        txtBz.innerHTML = "Buzzer (Muted)";
      } else {
        btn.innerHTML = "MUTE BUZZER";
        btn.style.backgroundColor = "#e74c3c";
        txtBz.innerHTML = "Buzzer";
      }
    });

    function toggleMute() {
      db.ref('sensor/is_muted').once('value').then((snapshot) => {
        let statusSekarang = snapshot.val();
        db.ref('sensor').update({ is_muted: !statusSekarang });
      });
    }
  </script>
</body>
</html>
