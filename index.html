<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Fire Alarm Dashboard</title>
  
  <!-- Font Modern (Poppins) -->
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;800&display=swap" rel="stylesheet">
  
  <style>
    :root {
      --bg-color: #0b0c10;
      --card-bg: rgba(30, 32, 40, 0.6);
      --card-border: rgba(255, 255, 255, 0.08);
      --neon-red: #ff2a2a;
      --neon-green: #00ff88;
      --text-main: #ffffff;
      --text-muted: #8892b0;
    }

    body { 
      font-family: 'Poppins', sans-serif; 
      background: radial-gradient(circle at top, #1a0b0b 0%, var(--bg-color) 80%);
      color: var(--text-main); 
      margin: 0; 
      padding: 0;
      min-height: 100vh;
      overflow-x: hidden;
    }

    /* Container Dashboard Utama */
    .dashboard-container {
      max-width: 1000px;
      margin: 0 auto;
      padding: 30px 20px;
      display: flex;
      flex-direction: column;
      gap: 20px;
    }

    /* Header */
    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 15px;
      margin-bottom: 10px;
    }

    .title {
      font-size: 2.2rem;
      font-weight: 800;
      margin: 0;
      background: linear-gradient(90deg, #ff416c, #ff4b2b);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      text-transform: uppercase;
      letter-spacing: 2px;
    }

    /* Glassmorphism Card Style */
    .card {
      background: var(--card-bg);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 1px solid var(--card-border);
      border-radius: 20px;
      padding: 25px;
      box-shadow: 0 15px 35px rgba(0,0,0,0.4);
    }

    /* Top Bar: Status & Mute */
    .top-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 15px;
    }

    .status-badge {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      background: rgba(0,0,0,0.5);
      padding: 10px 20px;
      border-radius: 50px;
      font-weight: 600;
      font-size: 0.95rem;
      border: 1px solid #333;
    }
    .status-badge .dot { width: 12px; height: 12px; border-radius: 50%; }
    .status-ready .dot { background: var(--neon-green); box-shadow: 0 0 10px var(--neon-green); }
    .status-error .dot { background: var(--neon-red); box-shadow: 0 0 10px var(--neon-red); animation: pulse 1s infinite; }

    .btn-info {
      background: transparent; border: 2px solid var(--neon-red); color: var(--neon-red);
      border-radius: 50%; width: 28px; height: 28px; font-weight: bold;
      cursor: pointer; display: none; align-items: center; justify-content: center;
      transition: 0.3s;
    }
    .btn-info:hover { background: var(--neon-red); color: white; }

    .btn-mute {
      background: #e74c3c; color: white; border: none; padding: 12px 30px;
      font-size: 1rem; font-weight: 600; border-radius: 50px; cursor: pointer;
      transition: all 0.3s ease; text-transform: uppercase; letter-spacing: 1px;
      box-shadow: 0 5px 15px rgba(231, 76, 60, 0.4);
    }
    .btn-mute:hover { transform: translateY(-2px); box-shadow: 0 8px 20px rgba(231, 76, 60, 0.6); }
    .btn-mute:active { transform: translateY(1px); }
    .btn-mute.muted { background: #555; box-shadow: none; }

    /* Main Temperature Display */
    .temp-card { text-align: center; position: relative; padding: 40px 20px; }
    .temp-label { color: var(--text-muted); font-size: 1.1rem; text-transform: uppercase; letter-spacing: 2px; margin-bottom: 10px; }
    .temp-value { font-size: 6rem; font-weight: 800; color: #fff; text-shadow: 0 0 30px rgba(255, 140, 0, 0.5); line-height: 1; }

    /* Warning Banner */
    .warning-banner {
      display: none; background: rgba(255, 42, 42, 0.1); border: 1px solid var(--neon-red);
      border-radius: 15px; padding: 15px; margin-top: 20px; color: var(--neon-red);
      font-weight: 800; font-size: 1.5rem; text-transform: uppercase; letter-spacing: 3px;
      animation: flashWarning 1s infinite alternate;
    }
    @keyframes flashWarning {
      0% { box-shadow: 0 0 10px rgba(255, 42, 42, 0.2); }
      100% { box-shadow: 0 0 30px rgba(255, 42, 42, 0.6); background: rgba(255, 42, 42, 0.2); }
    }

    /* Indicators Row */
    .indicators-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
      gap: 20px;
    }
    .indicator-item {
      display: flex; flex-direction: column; align-items: center; gap: 15px; padding: 20px;
    }
    .ind-circle {
      width: 60px; height: 60px; border-radius: 50%;
      background: #2a2a2a; border: 2px solid #444;
      transition: all 0.3s ease;
      position: relative; /* Penting untuk efek sirine */
      overflow: hidden;   /* Memotong cahaya putar agar tetap bulat */
    }
    .ind-label {
      font-size: 1.1rem; font-weight: 600; color: var(--text-muted); text-transform: uppercase;
    }

    /* ---------------------------------------------------- */
    /* EFEK WARNA & ANIMASI INDIKATOR AKTIF                 */
    /* ---------------------------------------------------- */
    .on-hijau { background: var(--neon-green); border-color: var(--neon-green); box-shadow: 0 0 30px var(--neon-green); }
    .on-merah { background: var(--neon-red); border-color: var(--neon-red); box-shadow: 0 0 30px var(--neon-red); }
    
    /* EFEK SPESIAL: LAMPU ALARM / SIRINE BERPUTAR */
    .on-buzzer { 
      background: #3a0000; /* Warna dasar merah gelap */
      border-color: #ff0000; 
      box-shadow: 0 0 30px rgba(255, 0, 0, 0.8), inset 0 0 15px rgba(0,0,0,0.8);
    }
    
    /* Cahaya Sorot Muternya */
    .on-buzzer::before {
      content: '';
      position: absolute;
      top: -50%; left: -50%; width: 200%; height: 200%;
      background: conic-gradient(
        transparent 0deg, 
        rgba(255, 0, 0, 0.4) 60deg, 
        #ff0000 120deg, 
        transparent 150deg
      );
      animation: rotate-siren 0.8s linear infinite;
    }

    /* Bohlam/Titik Tengah Lampu (Biar Realistis) */
    .on-buzzer::after {
      content: '';
      position: absolute;
      top: 50%; left: 50%; width: 22px; height: 22px;
      background: radial-gradient(circle, #ffaaaa, #ff0000);
      border-radius: 50%;
      transform: translate(-50%, -50%);
      box-shadow: 0 0 10px #ff0000, inset 0 0 5px #fff;
    }

    @keyframes rotate-siren {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
    /* ---------------------------------------------------- */

    /* Chart Card */
    .chart-card { height: 300px; padding: 20px; }
    canvas { width: 100% !important; height: 100% !important; }

    /* Modal Pop-up */
    .modal-overlay {
      display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(0,0,0,0.85); backdrop-filter: blur(5px); z-index: 999;
      justify-content: center; align-items: center; padding: 20px; box-sizing: border-box;
    }
    .modal-content {
      background: #1a1c23; padding: 30px; border-radius: 20px; width: 100%; max-width: 450px;
      border: 1px solid var(--neon-red); box-shadow: 0 20px 50px rgba(0,0,0,0.5); text-align: left;
    }
    .modal-content h3 { margin-top: 0; color: var(--neon-red); font-size: 1.5rem; display: flex; align-items: center; gap: 10px; }
    .modal-content p { color: #ccc; line-height: 1.8; font-size: 1rem; margin-bottom: 25px; }
    .btn-close { background: var(--neon-red); border: none; color: white; padding: 12px 20px; width: 100%; border-radius: 10px; cursor: pointer; font-weight: 600; font-size: 1rem; text-transform: uppercase; }

    /* Responsif */
    @media (max-width: 600px) {
      .temp-value { font-size: 4.5rem; }
      .header { justify-content: center; text-align: center; }
      .top-bar { flex-direction: column; width: 100%; }
      .btn-mute { width: 100%; }
    }
  </style>

  <!-- Firebase & Chart.js -->
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>

  <div class="dashboard-container">
    
    <div class="header">
      <h1 class="title">🔥 Fire Alarm System</h1>
    </div>

    <!-- Top Bar (Status & Mute) -->
    <div class="card top-bar">
      <div class="status-badge" id="badgeStatus">
        <div class="dot"></div>
        <span id="txtStatus">Sensor Ready</span>
        <button id="btnInfo" class="btn-info" onclick="bukaModal()">i</button>
      </div>
      
      <button class="btn-mute" id="btnMute" onclick="toggleMute()">
        Mute Buzzer
      </button>
    </div>

    <!-- Main Temp & Warning -->
    <div class="card temp-card">
      <div class="temp-label">Suhu Ruangan Terkini</div>
      <div class="temp-value" id="nilaiSuhu">--<span style="font-size: 3rem;">°C</span></div>
      
      <div class="warning-banner" id="txtWarning">
        ⚠️ Fire Level 1 ⚠️
      </div>
    </div>

    <!-- Indicators -->
    <div class="card indicators-grid">
      <div class="indicator-item">
        <div class="ind-circle" id="indHijau"></div>
        <div class="ind-label">Aman</div>
      </div>
      <div class="indicator-item">
        <div class="ind-circle" id="indMerah"></div>
        <div class="ind-label">Panas</div>
      </div>
      <div class="indicator-item">
        <div class="ind-circle" id="indBuzzer"></div>
        <div class="ind-label">Buzzer</div>
      </div>
    </div>

    <!-- Chart -->
    <div class="card chart-card">
      <canvas id="suhuChart"></canvas>
    </div>

  </div>

  <!-- Modal Peringatan Error -->
  <div class="modal-overlay" id="modalMasalah">
    <div class="modal-content">
      <h3>⚠️ Sensor Tidak Terdeteksi</h3>
      <p>
        <b>1.</b> Periksa kabel DS18B20.<br>
        <b>2.</b> Pastikan kabel Data terhubung ke <b>GPIO 4</b> ESP32.<br>
        <b>3.</b> Periksa arus Power (3.3V) dan Ground (GND).<br>
        <b>4.</b> Restart modul ESP32 Anda.
      </p>
      <button class="btn-close" onclick="tutupModal()">Saya Mengerti</button>
    </div>
  </div>

  <script>
    // Konfigurasi Firebase Anda
    const firebaseConfig = {
      apiKey: "AIzaSyDT9qR7sXFsKVuT-u3kXd1jDOhLCuDsVLk",
      authDomain: "iot-fire-sensor.firebaseapp.com",
      databaseURL: "https://iot-fire-sensor-default-rtdb.firebaseio.com/",
      projectId: "iot-fire-sensor",
      storageBucket: "iot-fire-sensor.firebasestorage.app",
      messagingSenderId: "952901033888",
      appId: "1:952901033888:web:8f7873e3a54b8e43dd4ec5"
    };

    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();

    // Inisialisasi Chart.js
    Chart.defaults.color = '#8892b0';
    const ctx = document.getElementById('suhuChart').getContext('2d');
    
    let gradientFill = ctx.createLinearGradient(0, 0, 0, 300);
    gradientFill.addColorStop(0, 'rgba(255, 140, 0, 0.5)');
    gradientFill.addColorStop(1, 'rgba(255, 140, 0, 0.0)');

    const suhuChart = new Chart(ctx, {
      type: 'line',
      data: {
        labels: [], 
        datasets: [{
          label: 'Suhu Aktual (°C)',
          data: [],
          borderColor: '#ff8c00',
          backgroundColor: gradientFill,
          borderWidth: 3,
          pointBackgroundColor: '#fff',
          pointBorderColor: '#ff8c00',
          pointBorderWidth: 2,
          pointRadius: 3,
          pointHoverRadius: 6,
          fill: true,
          tension: 0.4
        }]
      },
      options: {
        responsive: true,
        maintainAspectRatio: false,
        plugins: {
          legend: { display: false },
          tooltip: {
            backgroundColor: 'rgba(0,0,0,0.8)',
            titleFont: { size: 13, family: 'Poppins' },
            bodyFont: { size: 14, family: 'Poppins', weight: 'bold' },
            padding: 10,
            displayColors: false,
            callbacks: { label: function(context) { return context.parsed.y + ' °C'; } }
          }
        },
        scales: {
          x: { display: false, grid: { display: false } },
          y: { grid: { color: 'rgba(255,255,255,0.05)', drawBorder: false }, suggestedMin: 20, suggestedMax: 60 }
        }
      }
    });

    // Proses Realtime Data Firebase
    db.ref('sensor').on('value', (snapshot) => {
      const data = snapshot.val();
      if (!data) return;

      // --- 1. Status Sensor & Tombol Info ---
      let badge = document.getElementById('badgeStatus');
      let txtStatus = document.getElementById('txtStatus');
      let btnInfo = document.getElementById('btnInfo');
      
      if (data.sensor_ready === false) {
        badge.className = "status-badge status-error";
        txtStatus.innerHTML = "Sensor Error!";
        btnInfo.style.display = "flex";
      } else {
        badge.className = "status-badge status-ready";
        txtStatus.innerHTML = "Sensor Ready";
        btnInfo.style.display = "none";
      }

      // --- 2. Update Suhu Besar & Grafik ---
      document.getElementById('nilaiSuhu').innerHTML = Number(data.suhu).toFixed(1) + '<span style="font-size: 3rem;">°C</span>';
      
      if(data.sensor_ready) {
        let waktu = new Date().toLocaleTimeString();
        suhuChart.data.labels.push(waktu);
        suhuChart.data.datasets[0].data.push(data.suhu);
        if (suhuChart.data.labels.length > 20) { 
          suhuChart.data.labels.shift();
          suhuChart.data.datasets[0].data.shift();
        }
        suhuChart.update();
      }

      // --- 3. Animasi Lampu Indikator ---
      document.getElementById('indHijau').className = data.hijau ? 'ind-circle on-hijau' : 'ind-circle';
      document.getElementById('indMerah').className = data.merah ? 'ind-circle on-merah' : 'ind-circle';
      
      // Indikator Buzzer memanggil class efek sirine
      document.getElementById('indBuzzer').className = data.buzzer_ui ? 'ind-circle on-buzzer' : 'ind-circle';

      // --- 4. Banner Peringatan Level 1 (Suhu >= 50) ---
      let txtWarning = document.getElementById('txtWarning');
      if (data.bahaya === 1) {
        txtWarning.style.display = "block";
      } else {
        txtWarning.style.display = "none";
      }

      // --- 5. Tombol Mute UI ---
      let btnMute = document.getElementById('btnMute');
      if (data.is_muted) {
        btnMute.innerHTML = '<span style="font-size:1.2rem;">🔇</span> BUZZER DIMUTE';
        btnMute.classList.add("muted");
      } else {
        btnMute.innerHTML = '<span style="font-size:1.2rem;">🔊</span> MUTE BUZZER';
        btnMute.classList.remove("muted");
      }
    });

    // --- Fungsi Kirim Perintah Mute ---
    function toggleMute() {
      db.ref('sensor/is_muted').once('value').then((snapshot) => {
        let statusSekarang = snapshot.val();
        db.ref('sensor').update({ is_muted: !statusSekarang });
      });
    }

    // --- Fungsi Modal Pemecahan Masalah ---
    function bukaModal() { document.getElementById('modalMasalah').style.display = 'flex'; }
    function tutupModal() { document.getElementById('modalMasalah').style.display = 'none'; }
  </script>
</body>
</html>
